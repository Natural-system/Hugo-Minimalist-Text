{{ define "main" }}
<style>
  .log-page-layout {
    display: flex;
    justify-content: center;
    gap: 30px;
    max-width: 980px;
    margin: 0 auto;
    position: relative;
  }
  .log-container {
    flex: 1;
    max-width: 800px;
    min-width: 0;
  }
  /* 左侧年份导航侧边栏 */
  .log-sidebar {
    width: 130px;
    flex-shrink: 0;
    font-size: 0.88rem;
  }
  .log-sidebar-inner {
    position: sticky;
    top: 20px;
    font-family: var(--font-mono);
  }
  .log-sidebar-title {
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--text-color);
    margin-bottom: 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border-color);
  }
  .year-nav-list {
    list-style: none;
    padding-left: 0;
    margin: 0;
  }
  .year-nav-item {
    margin: 6px 0;
  }
  .year-nav-link {
    display: block;
    padding: 4px 8px;
    color: var(--muted-color);
    text-decoration: none;
    border-radius: 4px;
    transition: all 0.2s;
  }
  .year-nav-link:hover {
    color: var(--accent-color);
    background: var(--border-color);
  }
  .year-nav-link.active {
    color: var(--accent-color);
    font-weight: 600;
    background: rgba(0, 0, 0, 0.05);
  }
  /* 日志正文排版 */
  .log-year-title {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--text-color);
    margin: 10px 0 15px 0;
    padding-bottom: 6px;
    border-bottom: 2px solid var(--accent-color);
  }
  .log-month-title {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--text-color);
    opacity: 0.9;
    margin: 25px 0 12px 0;
    padding-left: 6px;
    border-left: 3px solid var(--muted-color);
  }
  .log-timeline {
    position: relative;
    padding-left: 18px;
    margin-bottom: 15px;
    border-left: 2px solid var(--border-color);
  }
  .log-item {
    position: relative;
    margin-bottom: 24px;
  }
  .log-item::before {
    content: "";
    position: absolute;
    left: -23px;
    top: 5px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background-color: var(--accent-color);
    border: 2px solid var(--bg-color);
  }
  .log-item h3 {
    font-family: var(--font-mono);
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--muted-color);
    margin: 0 0 6px 0;
  }
  .log-item p {
    font-size: 0.95rem;
    line-height: 1.6;
    color: var(--text-color);
    margin: 0 0 12px 0;
  }
</style>

<div class="log-page-layout">
  <!-- 左侧：多页面年份导航侧边栏 -->
  <aside class="log-sidebar" id="log-sidebar">
    <div class="log-sidebar-inner">
      <div class="log-sidebar-title">年份归档</div>
      <ul class="year-nav-list">
        {{ $currentPage := . }}
        {{ $allLogs := where .Site.RegularPages "Section" "logs" }}
        {{ range sort $allLogs "File.BaseFileName" "desc" }}
          <li class="year-nav-item">
            <a href="{{ .RelPermalink }}" class="year-nav-link {{ if eq $currentPage . }}active{{ end }}">
              {{ .Title }}
            </a>
          </li>
        {{ end }}
      </ul>
    </div>
  </aside>

  <!-- 右侧：当前页面的日志正文（轻量化渲染，不再全量堆砌） -->
  <div class="log-container">
    <header class="article-header">
      <h1 class="article-title">{{ .Title }} 随想日志</h1>
      <div class="meta-info" style="font-size: 0.85rem; color: var(--muted-color); font-family: var(--font-mono); margin-top: 6px;">
        记录日常随感与碎片思考 · 静态原生渲染 · 高速加载
      </div>
    </header>

    <!-- 直接输出当前 Markdown 文件的内容，由 Hugo 静态编译，体积缩减 95% 以上 -->
    <div class="log-content-body" style="margin-top: 2rem;">
      {{ .Content }}
    </div>

    <!-- 评论区系统 (Giscus) -->
    <div class="article-comments" style="margin-top: 3.5rem; padding-top: 2rem; border-top: 1px solid var(--border-color);">
<script src="https://giscus.app/client.js"
        data-repo="Natural-system/Hugo-Minimalist-Text"
        data-repo-id="R_kgDOTyeF1g"
        data-category="General"
        data-category-id="DIC_kwDOTyeF1s4DE8hV"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="bottom"
        data-theme="preferred_color_scheme"
        data-lang="zh-CN"
        crossorigin="anonymous"
        async>
</script>
    </div>
  </div>
</div>
{{ end }}
