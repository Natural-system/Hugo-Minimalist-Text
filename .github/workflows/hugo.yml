name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main  # 如果你的默认分支是 master，请改成 master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: "pages-build-${{ github.ref }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # === 【新增】1. 设置 Python 环境 ===
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # === 【新增】2. 安装短链接脚本依赖库 ===
      - name: Install dependencies
        run: |
          pip install python-frontmatter

      # === 【新增】3. 运行自动生成短链接的脚本 ===
      - name: Generate Short Slugs for New Posts
        run: |
          python scripts/gen_slug.py

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build
        run: hugo --minify

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public