baseURL = "https://natural-system.github.io/Hugo-Minimalist-Text/"
locale = "zh-CN"
title = "Self-Transcendence"
preserveTaxonomyNames = true

[params]
  description = "自豪的说，拥有一个高度健全+高度整合的人格，是非常幸运的事"
  author = "阿冰"
  email = "natural-system@users.noreply.github.com"

# 显式声明 Taxonomy 映射，确保 Hugo 正确处理分类数据
[taxonomies]
  category = "categories"
  tag = "tags"

# 完美对应原 Jekyll 的 permalink 路径规格
[permalinks]
  posts = "/:year/:month/:day/:title/"
  logs = "/log/:slug/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true # 允许 Markdown 内嵌入 HTML